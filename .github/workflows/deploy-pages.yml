name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure GitHub Pages (Actions)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: "workflow",
              });
              core.info("GitHub Pages site created (workflow source).");
            } catch (error) {
              const status = error.status || (error.response && error.response.status);
              // 409 = already exists; 422 often means already configured
              if (status === 409 || status === 422) {
                core.info("GitHub Pages already configured.");
                return;
              }
              // Try switching existing site to workflow build
              try {
                await github.rest.repos.updateInformationAboutPagesSite({
                  owner,
                  repo,
                  build_type: "workflow",
                });
                core.info("GitHub Pages updated to workflow source.");
              } catch (updateError) {
                core.warning(
                  `Could not auto-enable Pages (${status}): ${error.message}. ` +
                    "Enable manually: Settings → Pages → Source: GitHub Actions."
                );
              }
            }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
